name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Dependencies
        run: npm install

      - name: Capacitor Sync
        run: npx cap sync

      - name: Build with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: Pro Chat Release v${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
          body: |
            🚀 Your Pro Chat Android App is ready!
            Download the `app-debug.apk` below to install it on your phone.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
