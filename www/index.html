<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Pro Chat</title>
    <meta name="theme-color" content="#020617">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="chat.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gun/sea.js"></script>
</head>
<body>

<!-- CALL OVERLAY -->
<div id="calling-ui">
    <video id="remote-video" autoplay playsinline></video>
    <video id="local-video" autoplay playsinline muted></video>
    <div class="call-top">
        <p id="call-status">Connecting...</p>
    </div>
    <div class="call-controls">
        <button class="ctrl-btn" id="toggle-mic">🎙️</button>
        <button class="ctrl-btn end" id="end-call-btn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="white"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08C.11 12.9 0 12.65 0 12.37c0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/></svg>
        </button>
        <button class="ctrl-btn" id="toggle-cam">📹</button>
    </div>
</div>

<!-- SIDEBAR -->
<div id="sidebar" class="sidebar">
    <div class="sidebar-inner">
        <div class="sidebar-head">
            <span>Contacts</span>
            <button id="close-sidebar" class="close-btn">✕</button>
        </div>

        <div class="my-id-card">
            <p class="label">Your Private ID</p>
            <p id="my-peer-id" class="id-val">Loading...</p>
            <button id="copy-id-btn" class="copy-btn">Copy ID</button>
        </div>

        <div class="sidebar-section">
            <p class="section-label">CHATS</p>
            <div id="global-btn" class="contact-row active-contact">
                <div class="c-avatar">🌍</div>
                <div class="c-info">
                    <h4>Global Community</h4>
                    <p>Public Chat</p>
                </div>
            </div>
        </div>

        <div class="sidebar-section grow">
            <p class="section-label">PRIVATE</p>
            <div id="contact-list"></div>
        </div>

        <div class="add-contact">
            <input id="friend-id-input" type="text" placeholder="Paste Friend's ID...">
            <button id="connect-btn">Add Contact</button>
        </div>
    </div>
</div>
<div id="sidebar-overlay" class="sidebar-overlay"></div>

<!-- MAIN APP -->
<div class="app-shell">
    <!-- Header -->
    <header class="app-header">
        <div class="header-left">
            <button id="open-sidebar" class="icon-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
            </button>
            <div class="header-info">
                <span id="chat-title">Global Community</span>
                <span id="status-text" class="status">● Online</span>
            </div>
        </div>
        <div class="header-right">
            <button id="video-call-btn" class="icon-btn hidden">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
            </button>
        </div>
    </header>

    <!-- Messages -->
    <main id="chat-body" class="chat-body"></main>

    <!-- Input -->
    <footer class="chat-footer">
        <div class="input-row">
            <button id="voice-btn" class="footer-icon-btn" title="Hold to record">🎙</button>
            <div class="input-box">
                <input id="msg-input" type="text" placeholder="Message..." autocomplete="off">
            </div>
            <button id="send-btn" class="send-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
        </div>
    </footer>
</div>

<!-- VOICE RECORDING OVERLAY -->
<div id="voice-overlay" class="voice-overlay">
    <div class="wave-bars">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div>
    </div>
    <span>Release to send</span>
</div>

<!-- ONBOARDING -->
<div id="onboarding" class="onboarding">
    <div class="onboard-card">
        <div class="onboard-icon">💬</div>
        <h1>Pro Chat</h1>
        <p>Decentralized · Encrypted · Fast</p>
        <input id="name-input" type="text" placeholder="Enter your name" maxlength="20">
        <button id="start-btn" disabled>Start Chatting</button>
    </div>
</div>

<script src="chat.js"></script>
</body>
</html>
