<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download ProChat Infinity</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #6366f1;
            --bg: #0f172a;
        }
        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: white;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            z-index: 10;
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(20px);
            padding: 50px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            max-width: 500px;
        }
        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(to right, #818cf8, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            color: #94a3b8;
            margin-bottom: 30px;
        }
        .download-btn {
            display: inline-block;
            padding: 15px 40px;
            background: var(--accent);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            font-family: 'Orbitron', sans-serif;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px var(--accent);
        }
        .download-btn:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 0 40px var(--accent);
        }
        .qr-code {
            margin-top: 30px;
            background: white;
            padding: 10px;
            border-radius: 10px;
            display: inline-block;
        }
        .canvas-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
        }
    </style>
</head>
<body>
    <canvas id="bg-canvas" class="canvas-bg"></canvas>
    <div class="container">
        <h1>PROCHAT INFINITY</h1>
        <p>The world's most advanced decentralized messaging platform is now ready for your device.</p>
        
        <a href="ProChat.apk" class="download-btn">DOWNLOAD APK</a>
        
        <div style="margin-top: 20px;">
            <p>Or access the live web version:</p>
            <a href="index.html" style="color: var(--accent); text-decoration: none; font-weight: 600;">Open Web App &rarr;</a>
        </div>

        <div class="qr-code">
            <!-- Simplified QR placeholder -->
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://github.com/RAJASIraj28/CHAT-PRO" alt="QR Code">
        </div>
    </div>

    <script>
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2;
                this.speedX = Math.random() * 0.5 - 0.25;
                this.speedY = Math.random() * 0.5 - 0.25;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
            }
            draw() {
                ctx.fillStyle = 'rgba(99, 102, 241, 0.5)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < 100; i++) particles.push(new Particle());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
