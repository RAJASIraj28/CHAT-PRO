<!-- CREATING A WEBPAGE FOR ELECTRONIC SHOP FOR SHOPING-->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAY HI</title>
</head>
<style>
    body {
        background-color: rgb(221, 238, 247);
        color: white;
        width: 100%;
    }

    head {
        font-family: Arial;
    }

    .box {
        width: 100%;
        height: 50%;
        background-color: rgb(146, 145, 144);
        color: white;
        border-radius: 10px;
    }

    .box2 {
        width: 350px;
        height: auto;
        background-color: rgb(155, 206, 244);
        color: rgb(0, 0, 0);
        align-items: left;
        margin: 5px;
        padding: 5px;
        border-radius: 10px;
        font-family: 'Times New Roman', Times, serif;
    }

    #nav {
        background-color: rgb(72, 172, 77);
        color: white;
        height: 50px;
    }

    button {
        background-color: rgb(117, 161, 184);
        color: rgb(62, 61, 61);
        height: 50px;
        width: 100px;
        border-radius: 10px;
        margin: 5px;
        padding: 5px;
        align-items: center;
        font-size: 20px;
        font-weight: bold;
        border-radius: 10%;
        float: right;
        margin-top: 0.001px;
        margin-bottom: 5px;
        margin-left: 5px;
        margin-right: 5px;
        border-color: rgb(179, 201, 145);
        transform: scale(1);
    }

    button:hover {
        transform: scale(0.98);
        background-color: rgb(210, 99, 99);
    }
</style>

<body>
    <div class=box2>
        <h2><i>
                PHONE
            </i>
        </h2>
        <img src="https://m.media-amazon.com/images/I/91oF9q-jE5L._AC_.jpg" alt="LAPTOP" width="200px" height="200px">
        <p style="color: rgb(56, 54, 54);">
            Price ₹40000
        </p>
        <p>
        <ul>
            <p>Intel Core Ultra 5 Processor</p>
            <p>16 GB DDR5 RAM</p>
            <p>64 bit Windows 11 Operating System</p>
            <p>512 GB SSD</p>
            <p>35.56 cm (14 inch) Display</p>
            <p>Office Home & Student 2024</p>
            <p>1 Year Onsite Warranty</p>
        </ul>

        <button>Buy Now</button>
    </div>

</body>

</html>
